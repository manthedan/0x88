name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per branch or PR; a newer push supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # LFS objects the tests and the build read. Everything else stays a pointer.
  LFS_INCLUDE: public/models/s4fix_v_ema.onnx,public/models/bt4_soap_rem_c19000_final.onnx,public/runtimes/centipawn-tvmjs-webgpu/**/*.wasm,public/runtimes/squareformer-tvm-hybrid/bt4-anneal-muon-best/v1/squareformer-ffn/**

# Lint, audit, tests and build are independent jobs, so one failure never hides
# another's result. Branch pushes already run CI, so a pull_request run is only
# needed for PRs from forks; the root jobs skip same-repo PR events.
jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biome
        run: npm run check:biome

  # Reports advisories without gating tests or the build. Four low advisories
  # remain in the SvelteKit chain that only a SvelteKit 3 major resolves.
  audit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Dependency audit
        run: npm audit --audit-level=high

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Key required LFS objects
        id: lfs
        run: echo "key=$(git lfs ls-files --long --include="$LFS_INCLUDE" --exclude="" | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.key }}
      - name: Fetch required release fixtures
        run: git lfs pull --include="$LFS_INCLUDE" --exclude=""
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The stager's required set is part of the key, so adding an asset refreshes the cache.
      - name: Restore LC0 parity assets
        id: lc0-cache
        uses: actions/cache/restore@v6
        with:
          path: ../models/lc0-bestnets
          key: lc0-parity-${{ hashFiles('public/models/lc0/manifest.json', 'scripts/stage_lc0_test_assets.mjs') }}
      # Hash-checks the committed LC0 manifest locally. A warm cache makes no
      # network calls. Missing bytes come from the commit-pinned release
      # (public/channels/stable.json → public/releases/*.json), not the live channel.
      - name: Stage and verify LC0 parity assets
        run: npm run test:stage-lc0-assets
      # Saved before the tests run, so a failing test never discards a fresh download.
      - name: Save LC0 parity assets
        if: steps.lc0-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ../models/lc0-bestnets
          key: ${{ steps.lc0-cache.outputs.cache-primary-key }}
      - name: Typecheck and tests
        run: npm test

  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Key required LFS objects
        id: lfs
        run: echo "key=$(git lfs ls-files --long --include="$LFS_INCLUDE" --exclude="" | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.key }}
      - name: Fetch required release fixtures
        run: git lfs pull --include="$LFS_INCLUDE" --exclude=""
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production asset stage and static build
        run: npm run build:netlify:r2
      - name: Verify deploy shell
        run: |
          test -f dist-client/index.html
          test -f dist-client/sw.js
          test -f dist-client/app/play/index.html
          test -f dist-client/app/analysis/index.html
          test -f dist-client/app/arena/index.html
          npm run deploy:ort-wasm-dedup-check
          npm run deploy:ort-runtime-assets-check
          test ! -e dist-client/runtimes
          test ! -e dist-client/models/lc0/t1-256x10-distilled-swa-2432500.batch1.f16.onnx
      - uses: actions/upload-artifact@v7
        with:
          name: dist-client
          path: dist-client
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  # Loads Home, Play, Analysis and Arena from the built client in headless
  # Chromium (no GPU, no engine start); fails on page errors or a failed init.
  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist-client
          path: dist-client
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Built client browser smoke
        run: npm run dist:browser-smoke -- --out artifacts/dist-browser-smoke.json
      - name: Upload smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dist-browser-smoke-${{ github.run_id }}
          path: artifacts/dist-browser-smoke.json
          if-no-files-found: warn
          retention-days: 14
