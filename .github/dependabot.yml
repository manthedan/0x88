version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor and patch bumps; majors arrive individually.
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
