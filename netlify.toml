[build]
  command = "VITE_LC0_ARTIFACT_CHANNEL_URL=https://assets.0x88.app/channels/stable.json VITE_LC0_BROWSER_ASSET_BASE_URL=https://assets.0x88.app npm run build:netlify:r2"
  publish = "dist-client"

[[redirects]]
  from = "/stockfish/stockfish-19-lite.wasm"
  to = "https://assets.0x88.app/stockfish/stockfish-19-lite.wasm"
  status = 200
  force = true

[[redirects]]
  from = "/stockfish/stockfish-19.wasm"
  to = "https://assets.0x88.app/stockfish/stockfish-19.wasm"
  status = 200
  force = true

# Legacy and short URLs point straight at the trailing-slash page URL: the
# directory form (/app/play) would cost a second 301 from Netlify.
[[redirects]]
  from = "/lc0-play.html"
  to = "/app/play/"
  status = 301

[[redirects]]
  from = "/lc0-analysis.html"
  to = "/app/analysis/"
  status = 301

[[redirects]]
  from = "/lc0-arena.html"
  to = "/app/arena/"
  status = 301

[[redirects]]
  from = "/play"
  to = "/app/play/"
  status = 301

[[redirects]]
  from = "/analysis"
  to = "/app/analysis/"
  status = 301

[[redirects]]
  from = "/arena"
  to = "/app/arena/"
  status = 301

[[redirects]]
  from = "/docs.html"
  to = "/docs/"
  status = 301

[[redirects]]
  from = "/lc0-policy-only.html"
  to = "/single-engine/"
  status = 301

# Keep engine pages eligible for WebAssembly threads/SAB experiments and WebGPU
# runtime probes. Engine artifacts are loaded lazily after selector opt-in.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Only features nothing on this site uses. Clipboard, WebGPU, wake lock
    # and cross-origin isolation are deliberately left at their defaults.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # connect-src names every origin the product fetches from: the asset host
    # (engines, models, channels, releases), the Lichess and Chess.com game
    # import APIs (src/lc0/gameImport.ts), and the Cloudflare Web Analytics
    # beacon endpoint. svelte.config.js keeps `https:` in the meta policy for
    # local ?assetBase= overrides; both policies apply here, so this one decides.
    # R2 builds COPY public/_headers unchanged; generation is a separate
    # maintenance command, not a build step. Keep this default policy and its
    # generated mirror identical (Netlify accepts both). Custom build-time
    # VITE_LC0_BROWSER_ASSET_BASE_URL / VITE_LC0_ARTIFACT_CHANNEL_URL origins
    # must be added to connect-src here, then `npm run deploy:generate-headers`.
    # The CSP gate fails with the exact missing origin before building/releasing.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://assets.0x88.app https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://assets.0x88.app https://lichess.org https://api.chess.com https://cloudflareinsights.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'; manifest-src 'self'"

# Root/product HTML should revalidate so app-shell changes and channel pointer
# changes are visible without waiting out a long browser TTL. Pages are served
# at pretty URLs (/app/play/ -> app/play/index.html), which `/*.html` does not
# match, so every page directory is listed; `/*.html` covers direct .html
# requests. These directories hold nothing but prerendered index.html files.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lab/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000"
    CDN-Cache-Control = "public, max-age=31536000"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000"

# Unlisted friend/tester diagnostics route. Do not link from public nav;
# keep search engines from indexing benchmark output.
[[headers]]
  for = "/lab/webgpu-lc0-diag/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Unlisted LC0 harness endpoint driven by the benchmark/parity scripts in
# scripts/ and embedded by the lab diagnostics page. Not a product surface:
# do not link from public nav; keep it out of search indexes.
[[headers]]
  for = "/single-engine"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/single-engine/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=86400"
    CDN-Cache-Control = "public, max-age=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/lc0/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=86400"
    CDN-Cache-Control = "public, max-age=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400"

# Mutable control-plane pointers must revalidate. The CDN may retain a short
# stale-if-error copy, but browsers never treat a channel as immutable.
[[headers]]
  for = "/channels/*"
  [headers.values]
    Cache-Control = "public, max-age=0, no-cache"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-if-error=86400"
    CDN-Cache-Control = "public, max-age=60, stale-if-error=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=60, stale-if-error=86400"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

# Release manifests and hash-keyed blobs are write-once. Stable /models and
# /engines names deliberately do not match these immutable rules.
[[headers]]
  for = "/releases/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000"
    CDN-Cache-Control = "public, max-age=31536000"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

# Long-lived immutable caching is reserved for content-addressed artifact paths.
# Stable engine/model URLs must not use immutable because their bytes may change
# while older browser HTTP-cache entries remain fresh. CORP must be cross-origin
# here so hashed blobs stay loadable under the site-wide COEP: require-corp.
# The configured R2 build publishes no /artifacts/ or /engines/ files (the asset
# host serves them; prepare_netlify_r2_public_assets.mjs skips artifacts/). The
# rules stay, and the deploy gate requires them, so that a profile publishing
# the full public/ tree (npm run build:netlify) cannot serve them unsafely.
[[headers]]
  for = "/artifacts/sha256/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Netlify-CDN-Cache-Control = "public, max-age=31536000"
    CDN-Cache-Control = "public, max-age=31536000"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

# Logical heavy URLs are mutable aliases. Revalidate instead of pinning a stale
# model/engine for a year; immutable release manifests point at hashed blobs.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

[[headers]]
  for = "/engines/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

# Reckless engine artifacts, for profiles that publish them from this origin
# (npm run build:netlify). The configured R2 build does not: /reckless/ is an
# asset-host prefix in src/lc0/assetUrls.ts and these files are pruned from the
# published tree, so in production these rules match nothing. Logical names
# whose bytes change between builds, so the browser TTL stays short.
[[headers]]
  for = "/reckless/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/reckless/*.nnue"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/reckless/*corresponding-source*.tar.gz"
  [headers.values]
    Content-Type = "application/gzip"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
