[build]
  command = "VITE_LC0_ARTIFACT_CHANNEL_URL=https://assets.0x88.app/channels/stable.json VITE_LC0_BROWSER_ASSET_BASE_URL=https://assets.0x88.app npm run build:netlify:r2"
  publish = "dist-client"

[[redirects]]
  from = "/stockfish/stockfish-18-lite.wasm"
  to = "https://assets.0x88.app/stockfish/stockfish-18-lite.wasm"
  status = 200
  force = true

[[redirects]]
  from = "/stockfish/stockfish-18.wasm"
  to = "https://assets.0x88.app/stockfish/stockfish-18.wasm"
  status = 200
  force = true

[[redirects]]
  from = "/lc0-play.html"
  to = "/app/play"
  status = 301

[[redirects]]
  from = "/lc0-analysis.html"
  to = "/app/analysis"
  status = 301

[[redirects]]
  from = "/lc0-arena.html"
  to = "/app/arena"
  status = 301

[[redirects]]
  from = "/play"
  to = "/app/play"
  status = 301

[[redirects]]
  from = "/analysis"
  to = "/app/analysis"
  status = 301

[[redirects]]
  from = "/arena"
  to = "/app/arena"
  status = 301

[[redirects]]
  from = "/docs.html"
  to = "/docs"
  status = 301

[[redirects]]
  from = "/lc0-policy-only.html"
  to = "/single-engine"
  status = 301

# Keep engine pages eligible for WebAssembly threads/SAB experiments and WebGPU
# runtime probes. Engine artifacts are loaded lazily after selector opt-in.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

# Root/product HTML should revalidate so app-shell changes and channel pointer
# changes are visible without waiting out a long browser TTL.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Mutable release-channel pointers are tiny and must revalidate in browsers.
# CDN-specific headers may keep the edge copy briefly and tolerate origin errors.
[[headers]]
  for = "/channels/*"
  [headers.values]
    Cache-Control = "public, max-age=0, no-cache"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-if-error=86400"
    CDN-Cache-Control = "public, max-age=60, stale-if-error=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=60, stale-if-error=86400"

# Long-lived immutable caching is reserved for content-addressed artifact paths.
# Stable engine/model URLs must not use immutable because their bytes may change
# while older browser HTTP-cache entries remain fresh.
[[headers]]
  for = "/artifacts/sha256/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000"
    CDN-Cache-Control = "public, max-age=31536000"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000"
    CDN-Cache-Control = "public, max-age=31536000"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000"

# Unlisted friend/tester diagnostics route. Do not link from public nav;
# keep search engines from indexing benchmark output.
[[headers]]
  for = "/lab/webgpu-lc0-diag/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=86400"
    CDN-Cache-Control = "public, max-age=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/lc0/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=86400"
    CDN-Cache-Control = "public, max-age=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400"

# Mutable control-plane pointers must revalidate. The CDN may retain a short
# stale-if-error copy, but browsers never treat a channel as immutable.
[[headers]]
  for = "/channels/*"
  [headers.values]
    Cache-Control = "public, max-age=0, no-cache"
    Netlify-CDN-Cache-Control = "public, max-age=60, stale-if-error=86400"
    CDN-Cache-Control = "public, max-age=60, stale-if-error=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=60, stale-if-error=86400"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

# Release manifests and hash-keyed blobs are write-once. Stable /models and
# /engines names deliberately do not match these immutable rules.
[[headers]]
  for = "/releases/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000"
    CDN-Cache-Control = "public, max-age=31536000"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

[[headers]]
  for = "/artifacts/sha256/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Netlify-CDN-Cache-Control = "public, max-age=31536000"
    CDN-Cache-Control = "public, max-age=31536000"
    Cloudflare-CDN-Cache-Control = "public, max-age=31536000"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

# Logical heavy URLs are mutable aliases. Revalidate instead of pinning a stale
# model/engine for a year; immutable release manifests point at hashed blobs.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

[[headers]]
  for = "/engines/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=86400, stale-if-error=86400"
    Access-Control-Expose-Headers = "Age, Cache-Status, CF-Cache-Status, Content-Length, ETag"
    Timing-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
